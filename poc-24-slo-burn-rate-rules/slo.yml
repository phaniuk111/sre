# Sloth-style SLO specs. `generate.py` turns each into recording rules and multiwindow,
# multi-burn-rate alerts, the same shape Sloth and Pyrra produce.
service: checkout
slos:
  - name: requests-availability
    objective: 99.9
    description: Share of checkout API requests that don't fail with a 5xx.
    sli:
      events:
        error_query: sum(rate(http_requests_total{job="checkout",code=~"5.."}[{{.window}}]))
        total_query: sum(rate(http_requests_total{job="checkout"}[{{.window}}]))
    alerting:
      name: CheckoutAvailability
      page_labels: {severity: critical, team: checkout}
      ticket_labels: {severity: warning, team: checkout}
  - name: requests-latency
    objective: 99
    description: Share of checkout API requests answered within 300 ms.
    sli:
      events:
        error_query: |
          sum(rate(http_request_duration_seconds_count{job="checkout"}[{{.window}}]))
          - sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[{{.window}}]))
        total_query: sum(rate(http_request_duration_seconds_count{job="checkout"}[{{.window}}]))
    alerting:
      name: CheckoutLatency
      page_labels: {severity: critical, team: checkout}
      ticket_labels: {severity: warning, team: checkout}
