      sloth_window: 30d
  - record: slo:objective:ratio
    expr: vector(0.99)
    labels: &id002
      sloth_service: checkout
      sloth_slo: requests-latency
  - record: slo:error_budget:ratio
    expr: vector(1 - 0.99)
    labels: *id002
  - record: slo:period_error_budget_remaining:ratio
    expr: 1 - slo:sli_error:ratio_rate30d{sloth_service="checkout",sloth_slo="requests-latency"} / ignoring (sloth_window) slo:error_budget:ratio{sloth_service="checkout",sloth_slo="requests-latency"}
