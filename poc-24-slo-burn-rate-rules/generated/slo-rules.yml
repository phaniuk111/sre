groups:
- name: slo-sli-recordings-checkout-requests-availability
  rules:
  - record: slo:sli_error:ratio_rate5m
    expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[5m])))

      /

      (clamp_min(sum(rate(http_requests_total{job="checkout"}[5m])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 5m
  - record: slo:sli_error:ratio_rate30m
    expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[30m])))

      /

      (clamp_min(sum(rate(http_requests_total{job="checkout"}[30m])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 30m
  - record: slo:sli_error:ratio_rate1h
    expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[1h])))

      /

      (clamp_min(sum(rate(http_requests_total{job="checkout"}[1h])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 1h
  - record: slo:sli_error:ratio_rate2h
    expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[2h])))

      /

      (clamp_min(sum(rate(http_requests_total{job="checkout"}[2h])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 2h
  - record: slo:sli_error:ratio_rate6h
    expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[6h])))

      /

      (clamp_min(sum(rate(http_requests_total{job="checkout"}[6h])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 6h
  - record: slo:sli_error:ratio_rate1d
    expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[1d])))

      /

      (clamp_min(sum(rate(http_requests_total{job="checkout"}[1d])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 1d
  - record: slo:sli_error:ratio_rate3d
    expr: '(sum(rate(http_requests_total{job="checkout",code=~"5.."}[3d])))

      /

      (clamp_min(sum(rate(http_requests_total{job="checkout"}[3d])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 3d
  - record: slo:sli_error:ratio_rate30d
    expr: 'sum_over_time(slo:sli_error:ratio_rate5m{sloth_service="checkout",sloth_slo="requests-availability"}[30d])

      / ignoring (sloth_window)

      count_over_time(slo:sli_error:ratio_rate5m{sloth_service="checkout",sloth_slo="requests-availability"}[30d])'
    labels:
      sloth_service: checkout
      sloth_slo: requests-availability
      sloth_window: 30d
  - record: slo:objective:ratio
    expr: vector(0.9990000000000001)
    labels: &id001
      sloth_service: checkout
      sloth_slo: requests-availability
  - record: slo:error_budget:ratio
    expr: vector(1 - 0.9990000000000001)
    labels: *id001
  - record: slo:period_error_budget_remaining:ratio
    expr: 1 - slo:sli_error:ratio_rate30d{sloth_service="checkout",sloth_slo="requests-availability"} / ignoring (sloth_window) slo:error_budget:ratio{sloth_service="checkout",sloth_slo="requests-availability"}
    labels: *id001
- name: slo-alerts-checkout-requests-availability
  rules:
  - alert: CheckoutAvailability
    expr: "(\n  max(slo:sli_error:ratio_rate5m{sloth_service=\"checkout\",sloth_slo=\"requests-availability\"} > (14.4 * 0.001)) without (sloth_window)\n  and\n  max(slo:sli_error:ratio_rate1h{sloth_service=\"\
      checkout\",sloth_slo=\"requests-availability\"} > (14.4 * 0.001)) without (sloth_window)\n)\nor\n(\n  max(slo:sli_error:ratio_rate30m{sloth_service=\"checkout\",sloth_slo=\"requests-availability\"\
      } > (6.0 * 0.001)) without (sloth_window)\n  and\n  max(slo:sli_error:ratio_rate6h{sloth_service=\"checkout\",sloth_slo=\"requests-availability\"} > (6.0 * 0.001)) without (sloth_window)\n)"
    labels:
      severity: critical
      team: checkout
      sloth_severity: page
    annotations:
      summary: checkout is burning its requests-availability error budget fast.
      description: Share of checkout API requests that don't fail with a 5xx. Burn rate is above 6x on both a short and a long window; at this rate the 30-day budget is gone in under five days. Current
        1h error ratio {{ $value | humanizePercentage }}.
      runbook_url: https://runbooks.example.com/slo/checkout/requests-availability
  - alert: CheckoutAvailability
    expr: "(\n  max(slo:sli_error:ratio_rate2h{sloth_service=\"checkout\",sloth_slo=\"requests-availability\"} > (3.0 * 0.001)) without (sloth_window)\n  and\n  max(slo:sli_error:ratio_rate1d{sloth_service=\"\
      checkout\",sloth_slo=\"requests-availability\"} > (3.0 * 0.001)) without (sloth_window)\n)\nor\n(\n  max(slo:sli_error:ratio_rate6h{sloth_service=\"checkout\",sloth_slo=\"requests-availability\"}\
      \ > (1.0 * 0.001)) without (sloth_window)\n  and\n  max(slo:sli_error:ratio_rate3d{sloth_service=\"checkout\",sloth_slo=\"requests-availability\"} > (1.0 * 0.001)) without (sloth_window)\n)"
    labels:
      severity: warning
      team: checkout
      sloth_severity: ticket
    annotations:
      summary: checkout is slowly burning its requests-availability error budget.
      description: Share of checkout API requests that don't fail with a 5xx. The error budget will run out before the end of the 30-day window at the current rate ({{ $value | humanizePercentage }}).
      runbook_url: https://runbooks.example.com/slo/checkout/requests-availability
- name: slo-sli-recordings-checkout-requests-latency
  rules:
  - record: slo:sli_error:ratio_rate5m
    expr: '(sum(rate(http_request_duration_seconds_count{job="checkout"}[5m]))

      - sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[5m])))

      /

      (clamp_min(sum(rate(http_request_duration_seconds_count{job="checkout"}[5m])), 1e-9))'
    labels:
      sloth_service: checkout
      sloth_slo: requests-latency
      sloth_window: 5m
  - record: slo:sli_error:ratio_rate30m
