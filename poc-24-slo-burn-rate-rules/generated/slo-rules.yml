      sloth_window: 1d
  - record: slo:sli_error:ratio_rate3d
    expr: '(sum(rate(http_request_duration_seconds_count{job="checkout"}[3d]))

      - sum(rate(http_request_duration_seconds_bucket{job="checkout",le="0.3"}[3d])))

      /

      (clamp_min(sum(rate(http_request_duration_seconds_count{job="checkout"}[3d])), 1e-9))'
    labels:
