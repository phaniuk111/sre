  - record: slo:sli_error:ratio_rate30d
    expr: 'sum_over_time(slo:sli_error:ratio_rate5m{sloth_service="checkout",sloth_slo="requests-latency"}[30d])

      / ignoring (sloth_window)

      count_over_time(slo:sli_error:ratio_rate5m{sloth_service="checkout",sloth_slo="requests-latency"}[30d])'
    labels:
      sloth_service: checkout
