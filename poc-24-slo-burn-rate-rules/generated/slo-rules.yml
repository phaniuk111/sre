    expr: "(\n  max(slo:sli_error:ratio_rate2h{sloth_service=\"checkout\",sloth_slo=\"requests-latency\"} > (3.0 * 0.01)) without (sloth_window)\n  and\n  max(slo:sli_error:ratio_rate1d{sloth_service=\"\
      checkout\",sloth_slo=\"requests-latency\"} > (3.0 * 0.01)) without (sloth_window)\n)\nor\n(\n  max(slo:sli_error:ratio_rate6h{sloth_service=\"checkout\",sloth_slo=\"requests-latency\"} > (1.0 * 0.01))\
      \ without (sloth_window)\n  and\n  max(slo:sli_error:ratio_rate3d{sloth_service=\"checkout\",sloth_slo=\"requests-latency\"} > (1.0 * 0.01)) without (sloth_window)\n)"
    labels:
      severity: warning
      team: checkout
