# Scrape node exporters on EC2, discovered by tag, from a Prometheus (or the ADOT collector's
# prometheus receiver) running with the IAM role in terraform/iam.tf.
global:
  scrape_interval: 30s
  external_labels:
    cluster: platform-eu-west-2
scrape_configs:
  - job_name: ec2-node
    sample_limit: 5000          # a runaway exporter fails one scrape instead of the server
    label_limit: 30
    ec2_sd_configs:
      - region: eu-west-2
        port: 9100
        refresh_interval: 60s
        filters:
          - name: tag:Monitoring
            values: ["true"]
    relabel_configs:
      - source_labels: [__meta_ec2_instance_state]
        regex: running
        action: keep
      - source_labels: [__meta_ec2_tag_Service]
        target_label: job
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
      - source_labels: [__meta_ec2_availability_zone]
        target_label: az
      - regex: __meta_ec2_tag_(Team|CostCenter)
        action: labelmap
        replacement: ${1}
      # shard 0 of 2: the second server uses regex "1"
      - source_labels: [__address__]
        modulus: 2
        target_label: __tmp_hash
        action: hashmod
      - source_labels: [__tmp_hash]
        regex: "0"
        action: keep
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: node_scrape_collector_.*|go_.*
        action: drop
  - job_name: cmdb-http-sd
    http_sd_configs:
      - url: http://inventory.internal:8888/targets
        refresh_interval: 60s
