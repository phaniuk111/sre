groups:
  - name: availability
    interval: 1m
    rules:
      - record: job:probe_success:last5m
        expr: last_over_time(probe_success[5m])
      - alert: SSHDown
        expr: max_over_time(probe_success{job="blackbox_ssh"}[5m]) != 1
        for: 5m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: No successful SSH probe in the last five minutes.
          description: "Cannot SSH to {{ $labels.instance }} for at least 10 minutes."
          runbook_url: https://runbooks.example.com/ssh-down
      - alert: NTPOffsetHigh
        expr: node_timex_offset_seconds > 0.05 unless on (instance) changes(node_boot_time_seconds[30m]) > 0
        for: 30m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: Clock offset is above 50 milliseconds.
          description: "{{ $labels.instance }} is {{ $value | humanizeDuration }} away from NTP time."
          runbook_url: https://runbooks.example.com/ntp
