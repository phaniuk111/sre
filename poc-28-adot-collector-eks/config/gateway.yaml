# Deployment behind a Service (load balanced, autoscaled): tail sampling, span metrics and the
# service graph, then export to AWS: metrics to AMP (SigV4), traces to X-Ray, logs to CloudWatch Logs.
mode: deployment
replicas: 3
extensions:
  health_check: {}
  sigv4auth:
    region: eu-west-2
    service: aps
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
processors:
  memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25}
  tail_sampling:
    decision_wait: 10s
    policies:
      - {name: errors, type: status_code, status_code: {status_codes: [ERROR]}}
      - {name: slow, type: latency, latency: {threshold_ms: 500}}
      - {name: baseline, type: probabilistic, probabilistic: {sampling_percentage: 1}}
  filter/drop-noisy:
    error_mode: ignore
    metrics:
      metric:
        - 'name == "http.server.request.size" and resource.attributes["k8s.namespace.name"] == "load-test"'
  resource:
    attributes:
      - {key: deployment.environment, value: production, action: upsert}
  batch: {}
connectors:
  forward: {}
  spanmetrics:
    dimensions:
      - {name: http.method}
      - {name: http.status_code}
    namespace: traces.spanmetrics
  servicegraph:
    latency_histogram_buckets: [10ms, 50ms, 100ms, 250ms, 500ms, 1s, 2s]
exporters:
  prometheusremotewrite/amp:
    endpoint: https://aps-workspaces.eu-west-2.amazonaws.com/workspaces/ws-EXAMPLE/api/v1/remote_write
    auth: {authenticator: sigv4auth}
    resource_to_telemetry_conversion: {enabled: true}
  awsxray:
    region: eu-west-2
  awscloudwatchlogs:
    region: eu-west-2
    log_group_name: /eks/platform/applications
    log_stream_name: otel
service:
  extensions: [health_check, sigv4auth]
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [spanmetrics, servicegraph, forward]
    traces/out:
      receivers: [forward]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp, spanmetrics, servicegraph]
      processors: [memory_limiter, filter/drop-noisy, resource, batch]
      exporters: [prometheusremotewrite/amp]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awscloudwatchlogs]
