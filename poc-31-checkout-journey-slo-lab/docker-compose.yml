# docker compose up --build   ->  shop on :8080-8086, Prometheus :9090, Grafana :3000 (no login)
# Then drive it with: python lab.py status | chaos | config   (same ports as the local mode)
x-shop: &shop
  build: .
  environment:
      SHOP_EDGE_URL: http://edge:8080
      SHOP_CHECKOUT_URL: http://checkout:8081
      SHOP_CART_URL: http://cart:8082
      SHOP_INVENTORY_URL: http://inventory:8083
      SHOP_PAYMENT_URL: http://payment:8084
      SHOP_ORDERS_URL: http://orders:8085
      SHOP_RECOMMENDATIONS_URL: http://recommendations:8086
  restart: "no"

services:
  edge:
    <<: *shop
    command: ["python", "shop.py", "edge"]
    ports: ["8080:8080"]
  checkout:
    <<: *shop
    command: ["python", "shop.py", "checkout"]
    ports: ["8081:8081"]
  cart:
    <<: *shop
    command: ["python", "shop.py", "cart"]
    ports: ["8082:8082"]
  inventory:
    <<: *shop
    command: ["python", "shop.py", "inventory"]
    ports: ["8083:8083"]
  payment:
    <<: *shop
    command: ["python", "shop.py", "payment"]
    ports: ["8084:8084"]
  orders:
    <<: *shop
    command: ["python", "shop.py", "orders"]
    ports: ["8085:8085"]
  recommendations:
    <<: *shop
    command: ["python", "shop.py", "recommendations"]
    ports: ["8086:8086"]
  loadgen:
    <<: *shop
    command: ["python", "loadgen.py", "--rps", "10"]
    depends_on: [edge]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./solutions:/etc/prometheus/solutions:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/checkout-journey-slo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
