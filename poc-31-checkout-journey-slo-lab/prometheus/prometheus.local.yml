# Scrape every role every 5 s so the lab reacts quickly. Rules: rules/checkout-slo.yml
global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - ../rules/checkout-slo.yml
  - ../rules/checkout-probe.yml
scrape_configs:
  - job_name: edge
    static_configs:
      - targets: ['127.0.0.1:8080']
  - job_name: checkout
    static_configs:
      - targets: ['127.0.0.1:8081']
  - job_name: cart
    static_configs:
      - targets: ['127.0.0.1:8082']
  - job_name: inventory
    static_configs:
      - targets: ['127.0.0.1:8083']
  - job_name: payment
    static_configs:
      - targets: ['127.0.0.1:8084']
  - job_name: orders
    static_configs:
      - targets: ['127.0.0.1:8085']
  - job_name: recommendations
    static_configs:
      - targets: ['127.0.0.1:8086']
  - job_name: checkout-probe          # probe.py: one target per location
    static_configs:
      - targets: ['127.0.0.1:9201', '127.0.0.1:9202', '127.0.0.1:9203']
