# Scrape every role every 5 s so the lab reacts quickly. Rules: rules/checkout-slo.yml
global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/checkout-slo.yml
scrape_configs:
  - job_name: edge
    static_configs:
      - targets: ['edge:8080']
  - job_name: checkout
    static_configs:
      - targets: ['checkout:8081']
  - job_name: cart
    static_configs:
      - targets: ['cart:8082']
  - job_name: inventory
    static_configs:
      - targets: ['inventory:8083']
  - job_name: payment
    static_configs:
      - targets: ['payment:8084']
  - job_name: orders
    static_configs:
      - targets: ['orders:8085']
  - job_name: recommendations
    static_configs:
      - targets: ['recommendations:8086']
